[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaevidence"
version = "0.9.9.dev0"
description = "Reproducible cross-database scholarly evidence retrieval for systematic reviews and meta-analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dimitrios Galiatsatos"}]
keywords = ["systematic-review", "meta-analysis", "literature-search", "PRISMA", "bibliometrics", "evidence-synthesis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
metaevidence = "metaevidence.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
metaevidence = ["py.typed"]
