name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q

  package:
    name: Build and install artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Validate wheel in clean venv
        shell: bash
        run: |
          python -m venv /tmp/metaevidence-clean
          /tmp/metaevidence-clean/bin/python -m pip install --upgrade pip
          /tmp/metaevidence-clean/bin/python -m pip install dist/*.whl
          /tmp/metaevidence-clean/bin/python -c "import metaevidence; print(metaevidence.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
