name: Bug report
description: Report a reproducible MetaEvidence problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove API keys, institutional credentials, licensed bibliographic data and personal information before posting."
  - type: input
    id: version
    attributes:
      label: MetaEvidence version
      placeholder: 0.9.0.dev0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Include a small synthetic example whenever possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
